function sel(i,j) {
	document.forms[0].val.value = coltab[i][j]
	pal.style.backgroundColor = "#"+coltab[i][j]
}
function setCol(str) {
	document.forms[0].val.value = str
	pal.style.backgroundColor = "#"+str
}
function setColor() {
	var color;
	
	if (document.forms[0].trans.checked) {
		color = "transparent";
	}
	else {
		color = "#" + document.forms[0].val.value;
	}
		
	if (window.opener.document.all.editBox == null) {
		window.opener.setColor(color);
	}
	else {
		window.opener.document.all.editBox.setColor(color);
	}
	
	window.close();
}
function wincancel() {
	if (window.opener.document.all.editBox == null) {
		window.opener.focus();
	}
	else {
		window.opener.document.all.editBox.focus();
	}
	
	window.close();
}
